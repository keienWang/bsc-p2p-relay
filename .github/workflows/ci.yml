name: test
on: [push, pull_request]
permissions:
  contents: read
env:
  GOTOOLCHAIN: local
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.11'
          cache: true
      - name: Verify the security-patched toolchain
        run: |
          go version
          test "$(go env GOVERSION)" = go1.26.11
      - run: go mod download
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: go test -race -count=1 ./...
      - run: go build -trimpath -buildvcs=false ./cmd/bsc-relay
      - run: python3 scripts/smoke.py ./bsc-relay
      - run: python3 scripts/check_runtime_dependencies.py
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
  official_txpool:
    name: isolated official BSC txpool
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOFLAGS: -buildvcs=false -mod=readonly -modfile=integration/officialtxpool/go.mod -tags=officialtxpool
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.11'
          cache: true
          cache-dependency-path: |
            go.sum
            integration/officialtxpool/go.sum
      - name: Verify the security-patched toolchain
        run: |
          go version
          test "$(go env GOVERSION)" = go1.26.11
      - name: Check the tagged dependency boundary
        run: python3 scripts/check_runtime_dependencies.py
      - name: Vet the tagged relay
        run: go vet ./internal/relay
      - name: Test official txpool interoperability
        run: go test -race -count=1 -timeout=180s ./internal/relay
      - name: Install the pinned scanner independently
        run: GOBIN="$RUNNER_TEMP/officialpool-tools" GOFLAGS=-buildvcs=false go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Scan the tagged integration test graph
        run: '"$RUNNER_TEMP/officialpool-tools/govulncheck" -test -tags=officialtxpool -show=verbose ./internal/relay'
  canonical_isolation:
    name: synthetic canonical Parlia isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOFLAGS: -buildvcs=false -mod=readonly -p=1 -tags=canonicalisolation
      GOMAXPROCS: '2'
      GOTOOLCHAIN: local
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.11'
          cache: true
          # Separate race-worker cache from the default job's immutable key.
          # Cache misses still take the full bounded preparation/build path.
          cache-dependency-path: |
            go.mod
            go.sum
            compat/stunv2/go.mod
            compat/stunv2/go.sum
            internal/canonicalisolation/**/*.go
            scripts/prebuild_canonical_worker.sh
      - name: Verify the security-patched toolchain
        run: |
          go version
          test "$(go env GOVERSION)" = go1.26.11
      - name: Download the pinned modules
        run: go mod download
      - name: Reproduce the pinned synthetic canonical fixture
        env:
          BSC_MODERN_WIRE_OUTPUT_DIR: ${{ runner.temp }}/bsc-canonical-fixture
        run: go test -count=1 -timeout=180s -run='^TestModernWireCheckpointRoundTrip$' ./internal/checkpointproof
      - name: Check the tagged dependency boundary
        run: python3 scripts/check_runtime_dependencies.py
      - name: Vet the tagged research packages
        run: go vet ./internal/canonicalisolation/...
      - name: Check the worker prebuild contract
        run: python3 -m unittest discover -s scripts -p 'test_canonical_prebuild.py'
      - name: Prepare the canonical race-worker build cache
        timeout-minutes: 4
        run: bash scripts/prebuild_canonical_worker.sh
      - name: Test canonical admission, isolation and full replay
        env:
          BSC_CANONICAL_FIXTURE_DIR: ${{ runner.temp }}/bsc-canonical-fixture
        run: go test -race -ldflags='-s=false -w=false' -count=1 -timeout=180s -v ./internal/canonicalisolation/...
      - name: Install the pinned scanner independently
        run: GOBIN="$RUNNER_TEMP/canonical-tools" GOFLAGS=-buildvcs=false go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Scan the exact tagged research test graph
        run: '"$RUNNER_TEMP/canonical-tools/govulncheck" -test -tags=canonicalisolation -show=verbose ./internal/canonicalisolation/...'
